<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VC2026 第 9 课教学图</title>
  <style>
    :root {
      --ink: #102a43;
      --muted: #526d82;
      --paper: #f6f9fc;
      --white: #ffffff;
      --line: #c9d7e3;
      --blue: #146c94;
      --cyan: #20a4a8;
      --yellow: #f2c14e;
      --red: #c74b50;
      --green: #3a8f6b;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: var(--paper); }
    body {
      font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
    }

    .figure {
      width: 1600px;
      height: 900px;
      padding: 54px 64px 48px;
      background:
        linear-gradient(rgba(16, 42, 67, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 42, 67, 0.035) 1px, transparent 1px),
        var(--paper);
      background-size: 40px 40px;
      overflow: hidden;
    }

    h1 { margin: 0; font-size: 42px; line-height: 1.2; letter-spacing: 0; }
    .subtitle { margin-top: 10px; color: var(--muted); font-size: 23px; line-height: 1.45; }
    .timeline { display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px; margin-top: 45px; }
    .stage {
      min-height: 235px;
      padding: 24px 18px;
      background: var(--white);
      border: 2px solid var(--line);
      border-top: 9px solid var(--blue);
      position: relative;
    }
    .stage::after {
      content: "";
      position: absolute;
      right: -22px;
      top: 102px;
      width: 28px;
      height: 4px;
      background: var(--blue);
      z-index: 2;
    }
    .stage:last-child::after { display: none; }
    .stage.green { border-top-color: var(--green); }
    .stage.cyan { border-top-color: var(--cyan); }
    .stage.yellow { border-top-color: var(--yellow); }
    .stage .n { font-size: 17px; font-weight: 800; color: var(--blue); }
    .stage h2 { margin: 12px 0 12px; font-size: 25px; line-height: 1.25; letter-spacing: 0; }
    .stage p { margin: 0; font-size: 18px; line-height: 1.55; color: var(--muted); }

    .guardrails { display: grid; grid-template-columns: 1.05fr 1.4fr; gap: 22px; margin-top: 32px; }
    .band { background: var(--white); border: 2px solid var(--line); padding: 21px 26px; min-height: 206px; }
    .band.good { border-left: 10px solid var(--green); }
    .band.bad { border-left: 10px solid var(--red); }
    .band h3 { margin: 0 0 13px; font-size: 25px; letter-spacing: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip { padding: 9px 13px; border: 1px solid var(--line); background: #eef5f8; font-size: 17px; line-height: 1.25; }
    .bad .chip { background: #fff0f0; border-color: #efc4c6; }
    .footer { margin-top: 18px; display: flex; justify-content: space-between; color: var(--muted); font-size: 17px; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const figure = params.get("figure") || "final";

    function renderFinal() {
      document.getElementById("app").innerHTML = `
        <section class="figure">
          <h1>最终轮不是现场发明模型，而是执行一条冻结的证据链</h1>
          <div class="subtitle">D/E/F 只提供 NTC：先确认数据身份，再做预先验证的背景适配，最后生成、审计和打包</div>
          <div class="timeline">
            <article class="stage yellow"><div class="n">准备阶段</div><h2>冻结候选</h2><p>数据、LOCO 规则、权重、适配、生成器与集成权重</p></article>
            <article class="stage"><div class="n">数据入口</div><h2>确认数据包</h2><p>manifest、哈希、D/E/F、18,533 基因与最终面板</p></article>
            <article class="stage cyan"><div class="n">输入审计</div><h2>读取 NTC</h2><p>合同、UMI、检测基因、稀疏项、ntc_id 与背景表示</p></article>
            <article class="stage cyan"><div class="n">只用 NTC</div><h2>冻结式适配</h2><p>仅更新事先声明并在公开 LOCO 中验证过的部分</p></article>
            <article class="stage green"><div class="n">模型输出</div><h2>生成预测</h2><p>300 目标 × 3 背景 × 400 个原始计数细胞</p></article>
            <article class="stage green"><div class="n">双层审计</div><h2>模型 + 合同</h2><p>效应异常、计数 QC、标签、基因轴和稀疏上限</p></article>
            <article class="stage yellow"><div class="n">提交阶段</div><h2>预检与提交</h2><p>dry-run、打包、上传，并归档配置、日志与哈希</p></article>
          </div>
          <div class="guardrails">
            <section class="band good">
              <h3>最终轮允许进入模型的信息</h3>
              <div class="chips">
                <span class="chip">D/E/F NTC 原始计数</span>
                <span class="chip">官方 gene_names.csv</span>
                <span class="chip">官方 pert_counts.csv</span>
                <span class="chip">冻结的外部数据与模型</span>
              </div>
            </section>
            <section class="band bad">
              <h3>高风险的现场漂移</h3>
              <div class="chips">
                <span class="chip">凭匿名身份猜测手改背景</span>
                <span class="chip">用最终反馈临时调集成权重</span>
                <span class="chip">换验证划分只保留最好结果</span>
                <span class="chip">手改个别 target 矩阵</span>
                <span class="chip">混用 A/B/C 的旧 panel</span>
              </div>
            </section>
          </div>
          <div class="footer"><span>官方事实：最终轮数据与提交合同</span><span>工程规程：冻结边界、故障演练与归档顺序</span></div>
        </section>`;
    }

    if (figure !== "final") throw new Error(`Unknown figure: ${figure}`);
    renderFinal();
  </script>
</body>
</html>
